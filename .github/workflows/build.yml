name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "0.0.0-ci"
          }
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version = $v"

      - name: Restore
        run: dotnet restore UnlockKit.sln

      - name: Build
        run: dotnet build UnlockKit.sln -c Release --no-restore

      - name: Publish GUI (single file, self-contained)
        run: >
          dotnet publish src/UnlockKit.UI/UnlockKit.UI.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o dist/gui

      - name: Publish CLI (single file, self-contained)
        run: >
          dotnet publish src/UnlockKit/UnlockKit.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o dist/cli

      - name: Verify outputs
        shell: pwsh
        run: |
          $exe = "dist/gui/UnlockKit.exe"
          $cli = "dist/cli/unlockkit-cli.exe"
          foreach ($f in @($exe, $cli)) {
            if (-not (Test-Path $f)) { throw "missing build output: $f" }
            $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
            Write-Host "$f  $mb MB"
          }
          # smoke test: the CLI must at least answer --help
          & $cli --help | Out-Null
          if ($LASTEXITCODE -ne 2) { throw "unexpected exit code from --help: $LASTEXITCODE" }

      - name: Package CLI
        shell: pwsh
        run: |
          Compress-Archive -Path dist/cli/unlockkit-cli.exe `
                           -DestinationPath "dist/UnlockKit-cli-${{ steps.version.outputs.value }}-win-x64.zip" `
                           -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UnlockKit-${{ steps.version.outputs.value }}-win-x64
          path: |
            dist/gui/UnlockKit.exe
            dist/UnlockKit-cli-*-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $gui = "dist/gui/UnlockKit.exe"
          $zip = "dist/UnlockKit-cli-${{ steps.version.outputs.value }}-win-x64.zip"

          # Re-running a failed workflow must not fail on the existing release.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $gui $zip --clobber
          } else {
            gh release create $tag $gui $zip `
              --title "UnlockKit $tag" `
              --generate-notes
          }
